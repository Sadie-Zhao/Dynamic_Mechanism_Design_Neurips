# Experiment 2: Multi-good privately correlated budget auction (sweep)
experiment: private_budget_multigood

# Environment
n_buyers: 2
n_goods: 2
horizon: 5
discount: 0.9
initial_budget: 3.0

trans_base_rate: 1.0
trans_sigma_no: 0.01

# Mechanism variant: override with --variant flag
mechanism_variant: A

# Training
num_outer_epochs: 3000
outer_steps_per_epoch: 1
lr_theta: 1.0e-4

num_inner_steps: 400
lr_w: 3.0e-4

num_samples_train: 128

# Loss weights
alpha: 1.0e5
beta: 1.0e3

profit_goal: 2.0

policy_hidden: 128
residual_init_std: 1.0

print_iter: 100

early_stop: true
tol: 0.05
patience: 20

output_dir: outputs/private_budget_multigood_sweep
