# Experiment 2: Multi-good privately correlated budget auction (small scale)
experiment: private_budget_multigood

# Environment
n_buyers: 2
n_goods: 2
horizon: 5
discount: 0.9
initial_budget: 3.0

# Type transition hyperparams (logit-space Gaussian, same as bandit)
trans_base_rate: 1.0
trans_sigma_no: 0.01

# Mechanism variant: A (GBAM), B (richer history), or C (full history)
mechanism_variant: A

# Training (nested GD)
num_outer_epochs: 2000
outer_steps_per_epoch: 1
lr_theta: 1.0e-4

num_inner_steps: 300
lr_w: 3.0e-4

num_samples_train: 64

# Loss weights
alpha: 1.0e5
beta: 1.0e3

# With T=5, B_i=3.0, types~U[0,1]^2, two goods: expected revenue ~0.5-1.0
profit_goal: 2.0

policy_hidden: 128
residual_init_std: 1.0

print_iter: 50

early_stop: false
tol: 0.1
patience: 10

output_dir: outputs/private_budget_multigood_small
