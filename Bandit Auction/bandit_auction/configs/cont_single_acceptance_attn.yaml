experiment: cont_single
method: acceptance

# Environment
n_buyers: 2
n_goods: 1
horizon: 5
discount: 0.9
type_mean: 2.5
type_std: 0.8
types_low: 0.0
types_high: 5.0
sigma_no: 1.0
trans_lambda: 2.0
allocation_cost: 0.1

# Network
use_attn_mechanism: true   # mechanism_network_attn: adds cross-buyer attention after trunk

# Training
num_outer_epochs: 5000
outer_steps_per_epoch: 1
lr_theta: 5.0e-4
num_inner_steps: 400
lr_w: 1.0e-3
num_samples_train: 64

# Loss weights: L = alpha*[Regret]+ + [profit_goal-Profit]+ + beta*IR
alpha: 5.0
beta: 1.0
profit_goal: 9.8035   # Pavan Gittins benchmark for trans_lambda=2.0

# Checkpointing
checkpoint_thresh: 0.15
checkpoint_interval: 50

# Policy network
policy_hidden: 128
residual_init_std: 1.0

# Diagnostics
print_iter: 50

output_dir: outputs/cont_single/acceptance_attn
