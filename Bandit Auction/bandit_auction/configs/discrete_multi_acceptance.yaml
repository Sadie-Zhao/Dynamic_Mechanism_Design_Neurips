experiment: discrete_multi
method: acceptance

# Environment
n_buyers: 2
n_goods: 2
horizon: 5
discount: 0.9
type_values_per_good: [1.0, 2.0, 3.0]
allocation_cost: 0.1

# Training
num_outer_epochs: 2000
outer_steps_per_epoch: 1
lr_theta: 1.0e-4
num_inner_steps: 400
lr_w: 1.0e-3
num_samples_train: 64

# Loss weights: L = alpha*[Regret]+ + [profit_goal-Profit]+ + beta*IR
alpha: 5.0
beta: 1.0
profit_goal: 8.0   # placeholder; tune via binary search

# Checkpointing
checkpoint_thresh: 0.15
checkpoint_interval: 50

# Policy network (discrete)
policy_hidden: 128

# Diagnostics
print_iter: 50

output_dir: outputs/discrete_multi/acceptance
